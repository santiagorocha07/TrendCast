name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trendcast_test
          POSTGRES_USER: trendcast
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trendcast -d trendcast_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-lstm.txt
      - run: python train_model.py && python train_lstm.py
      - run: python -m unittest discover -s tests -v
        env:
          TEST_DATABASE_URL: postgresql://trendcast:test_only@127.0.0.1:5432/trendcast_test
      - run: npm ci && npm run build
        working-directory: frontend
